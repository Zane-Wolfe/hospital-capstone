apiVersion: 1

datasources:
  - name: PostgreSQL
    type: postgres
    uid: postgres-hospital
    url: postgres:5432
    user: ${POSTGRES_USER}
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
