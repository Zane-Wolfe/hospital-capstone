services:
  # --- Database ---
  influxdb:
    image: influxdb:2.7
    container_name: audio_event_db
    ports:
      - "8086:8086"
    volumes:
      - influxdb2_data:/var/lib/influxdb2
      - influxdb2_config:/etc/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=my_admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=my_secure_password123
      - DOCKER_INFLUXDB_INIT_ORG=hospital_monitoring_org
      - DOCKER_INFLUXDB_INIT_BUCKET=hospital_sounds
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-super-secret-auth-token
    networks:
      - monitoring_net

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_backend
    ports:
      - "8000:8000"
    depends_on:
      - influxdb
    env_file:
      - .env
    environment:
      - INFLUXDB_URL=http://influxdb:8086
    volumes:
      - ./model_training:/app/models:ro
    networks:
      - monitoring_net

  # --- Frontend Web UI ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audio_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - monitoring_net

volumes:
  influxdb2_data:
  influxdb2_config:

networks:
  monitoring_net:
