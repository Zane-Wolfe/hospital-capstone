services:

  # --- PostgreSQL (Config & Device State) ---
  postgres:
    image: postgres:16-alpine
    container_name: audio_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring_net

  # --- InfluxDB (Time-series Events) ---
  influxdb:
    image: influxdb:2.7
    container_name: audio_event_db
    ports:
      - "8086:8086"
    volumes:
      - influxdb2_data:/var/lib/influxdb2
      - influxdb2_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    networks:
      - monitoring_net

  # --- Backend API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_backend
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - influxdb
      - postgres
    env_file:
      - .env
    environment:
      INFLUXDB_URL: http://influxdb:8086
      AUDIO_SEGMENT_DURATION_SEC: ${AUDIO_SEGMENT_DURATION_SEC}
    volumes:
      - ./model_training:/app/models:ro
    networks:
      - monitoring_net

  # --- Frontend Web UI ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: audio_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - monitoring_net

  # --- Grafana (Analytics & Dashboards) ---
  grafana:
    image: grafana/grafana:11.4.0
    container_name: hospital_grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Passed through to provisioning files
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb
    networks:
      - monitoring_net

volumes:
  influxdb2_data:
  influxdb2_config:
  postgres_data:
  grafana_data:

networks:
  monitoring_net:
